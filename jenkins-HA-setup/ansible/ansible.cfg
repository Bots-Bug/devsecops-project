[defaults]
# Dynamic inventory directory
inventory          = inventory/

# SSH user for Amazon Linux 2
remote_user        = ec2-user

# Private key — passed via SSH agent forwarding (ssh -A)
# Do not hardcode the key path here — use ssh-agent on your laptop
private_key_file   = ~/.ssh/jenkins-prod-keypair.pem

# Roles path
roles_path         = roles/

# Faster output
stdout_callback    = yaml

# Don't prompt for host key verification (instances are new)
host_key_checking  = False

# Retry files
retry_files_enabled = True
retry_files_save_path = /tmp/

[inventory]
# Enable the aws_ec2 dynamic inventory plugin
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
# Pipelining speeds up Ansible significantly
pipelining = True

# Connection timeout
timeout = 30