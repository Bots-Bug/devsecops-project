[defaults]
# Dynamic inventory directory
inventory          = inventory/

# SSH user for Amazon Linux 2 and Amazon Linux 2023
remote_user        = ec2-user
private_key_file = ~/.ssh/jenkins-prod-keypair.pem
ansible_python_interpreter = /usr/bin/python
# Private key — use SSH agent forwarding (ssh -A) instead of hardcoding
# private_key_file = ~/.ssh/jenkins-prod-keypair.pem

# Roles path
roles_path         = roles/

# Output format — use built-in default, NOT community.general.yaml
# community.general.yaml was removed in community.general 12.0.0
# Using ansible-core built-in yaml formatter instead
stdout_callback    = ansible.builtin.default
result_format      = yaml

# Do not prompt for host key verification (fresh EC2 instances)
host_key_checking  = False

# Retry files
retry_files_enabled     = True
retry_files_save_path   = /tmp/

# Show task execution time
callbacks_enabled  = profile_tasks

[inventory]
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
pipelining = True
timeout    = 30

# Fix for SSH multiplexing on Amazon Linux
control_path        = /tmp/ansible-ssh-%%h-%%p-%%r
control_path_dir    = /tmp/.ansible/cp
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root

