---
# Jenkins Linux Agent Configuration Playbook
# Installs Java, downloads agent.jar from master, starts JNLP agent service
#
# Must run AFTER master.yml (agents download agent.jar from a running master)
#
# Usage:
#   ansible-playbook playbooks/linux_agent.yml

- name: Configure Jenkins Linux Agents
  hosts: jenkins-agent-linux   # Matches tag Role: jenkins-agent-linux
  become: true
  gather_facts: true
  serial: 1                    # Configure agents one at a time to avoid race conditions

  pre_tasks:
    - name: Wait for SSH
      wait_for_connection:
        timeout: 300
        delay: 10

    - name: Confirm host
      debug:
        msg: "Configuring Linux Agent on {{ inventory_hostname }} ({{ instance_name | default('unknown') }})"

    - name: Get Jenkins master private IP from dynamic inventory
      set_fact:
        # Get the first host in the jenkins-master group
        jenkins_master_ip: "{{ hostvars[groups['jenkins-master'][0]]['ansible_host'] }}"

    - name: Show master IP being used
      debug:
        msg: "Will connect to Jenkins master at {{ jenkins_master_ip }}"

  roles:
    - role: common              # Java install, base packages
    - role: jenkins_linux_agent # agent.jar download, JNLP service