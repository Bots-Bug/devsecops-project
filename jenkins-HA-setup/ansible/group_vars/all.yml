# Variables applied to ALL hosts (master + agents)

# Java version — must match across master and all agents
java_version: "21.0.11.10.1"
java_home: "/opt/java/amazon-corretto-{{ java_version }}-linux-x64"
java_tarball: "amazon-corretto-{{ java_version }}-linux-x64.tar.gz"
java_download_url: "https://corretto.aws/downloads/resources/{{ java_version }}/{{ java_tarball }}"

# AWS settings — read from instance metadata automatically via IAM role
aws_region: "us-east-1"
environment: "prod"
project: "jenkins"

# Jenkins settings
jenkins_port: 8080
jenkins_home: "/var/lib/jenkins"
jenkins_war_path: "/opt/jenkins/jenkins.war"
jenkins_user: "jenkins"
jenkins_group: "jenkins"

# Agent settings
agent_user: "jenkins-agent"
agent_home: "/home/jenkins-agent"